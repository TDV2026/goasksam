<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GoAskSam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="home">

<button id="hp-hamburger" aria-label="Menu" onclick="toggleRail()">☰</button>
<div id="rail-scrim" onclick="toggleRail(false)"></div>

<div id="rail">
  <div class="hp-logo">
    <div class="hp-logo-name">GoAskSam</div>
    <div class="hp-logo-tag">Seller intelligence from The Daily Vroom</div>
  </div>
  <button class="hp-newrec" onclick="newConversation()">+ New Recommendation</button>
  <div class="hp-rail-scroll">
    <div class="hp-section">Sell</div>
    <button class="hp-navitem" onclick="startSellFlow()">Get Recommendation</button>
    <button class="hp-navitem" onclick="showPowerSellerExplainer()">Find a PowerSeller</button>

    <div class="hp-section">Today's Market</div>
    <div id="market-cards-desktop"></div>

    <div class="hp-section">Learn</div>
    <button class="hp-navitem" onclick="showHowItWorks()">How Recommendations Work</button>
    <button class="hp-navitem" onclick="showSellingPlatforms()">Selling Platforms</button>
  </div>
  <div class="hp-rail-footer">
    <!-- STAGE_B: referral panel -->
    <button class="hp-navitem stub" data-stage-b="refer" onclick="stageBStub('Refer friends')">Refer friends</button>
    <!-- STAGE_B: profile modal -->
    <button class="hp-navitem stub" data-stage-b="settings" onclick="stageBStub('Settings')">Settings</button>
    <a class="hp-navitem" href="mailto:news@thedailyvroom.com?subject=GoAskSam%20feedback">Feedback</a>
  </div>
</div>

<div id="main">
  <div id="hp-topbar">
    <!-- STAGE_B: magic-link / Beehiiv auto sign-in; signed-in avatar + menu -->
    <div id="signin-area"><button class="hp-signin" data-stage-b="signin" disabled title="Arriving shortly" onclick="stageBStub('Sign in')">Sign in</button></div>
  </div>
  <div id="msgs"></div>
  <div id="input-area">
    <div class="hp-input-label hp-home-only">What are you selling?</div>
    <div id="input-box">
      <textarea id="inp" rows="1" placeholder="2018 Porsche 911 Carrera GTS"></textarea>
      <button id="btn">↑</button>
    </div>
    <div class="hp-reassurance hp-home-only">Recommendations are based on recent sales, seller performance and market trends.</div>
    <div id="market-cards-mobile" class="hp-home-only"></div>
    <div id="hint"></div>
  </div>
</div>

<script src="js/wizard.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/steps.js"></script>
<script src="js/result.js"></script>
<script src="js/chat-core.js"></script>
<script src="js/result-copy.js"></script>
<script src="js/entry.js"></script>
<script src="js/homepage.js"></script>
</body>
</html>
