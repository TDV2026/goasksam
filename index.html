<!-- CSS served at a VERSIONED PATH (not a ?query, which some edge caches ignore).
     styles.css stays on disk; a vercel.json rewrite maps this path to it. BUMP the
     token in BOTH index.html and vercel.json on every styles.css change. -->
<link rel="stylesheet" href="styles.20260829a.css">
<!-- Curtain removed at launch (Aug 2026): the pre-launch holding block, its inline
     curtain script + CSS, and the #curtain div were deleted here so the site is
     public. Crew access to the still-gated /onebox is via /api/crew?code= directly
     (onebox.html carries its own gate); api/crew.js keeps the crew/tester + bhs
     handling. robots.txt now allows indexing. -->
</head>
<body class="home">
<button id="hp-hamburger" aria-label="Menu" onclick="toggleRail()">☰</button>
<div id="rail-scrim" onclick="toggleRail(false)"></div>

<div id="rail">
  <a class="hp-logo" href="/">
    <div class="hp-logo-name">GoAskSam <span class="beta-badge">Beta</span></div>
    <div class="hp-logo-tag">Seller intelligence from The Daily Vroom</div>
  </a>
  <div class="hp-value-trio">
    <span>Platform fit</span>
    <span>PowerSeller match</span>
    <span>Selling strategy</span>
  </div>
  <div class="hp-rail-scroll">
    <button class="hp-navitem" onclick="setActiveNav(this);startSellFlow()">Where to sell</button>
    <button class="hp-navitem" onclick="setActiveNav(this);showPowerSellers()">PowerSellers</button>
    <button class="hp-navitem" onclick="setActiveNav(this);showHowItWorks()">How Sam decides</button>

    <!-- Saved results: signed-in only (auth.js toggles #nav-saved). "Your results" is an
         expandable inline section - expanding shows the recent 10 in the rail and never
         navigates the main area; a specific result or "View all" opens in main. -->
    <div id="nav-saved" class="saved-section" style="display:none">
      <div class="hp-rail-divider"></div>
      <button class="hp-navitem saved-toggle" aria-expanded="false" onclick="toggleSavedSubmenu()"><span>Your results</span><span class="saved-caret" id="saved-caret" aria-hidden="true">&#9656;</span></button>
      <div id="saved-submenu" class="saved-submenu" style="display:none"></div>
    </div>

    <!-- PULSE_RAIL: TODAY'S MARKET sidebar section removed pre-Phase-3. The daily
         pulse pipeline (scripts/refreshDailyPulse.js, lib/dailyPulse.json,
         api/dailyPulse.js, dailyPulseUnit) stays intact and scheduled. Re-enable
         by restoring the section heading + <div id="market-cards-desktop"></div>
         here and the loadDailyPulse() call in js/homepage.js. -->
  </div>
  <div class="hp-rail-footer">
    <!-- STAGE_B: profile modal -->
    <a class="hp-navitem" href="mailto:feedback@goasksam.com?subject=GoAskSam%20feedback" onclick="var f=document.querySelector('.hp-feedback-fallback');if(f)f.classList.add('shown')">Send feedback</a>
    <div class="hp-feedback-fallback">If nothing opens, email us at <a class="hp-copy-email" href="mailto:feedback@goasksam.com" title="Click to copy" onclick="try{navigator.clipboard&&navigator.clipboard.writeText('feedback@goasksam.com')}catch(e){}">feedback@goasksam.com</a></div>
    <a class="hp-navitem" href="/privacy">Privacy</a>
  </div>
</div>

<div id="main">
  <div id="hp-topbar">
    <div class="hp-actions">
      <button id="hp-gear" title="Settings" aria-label="Settings" onclick="openSettings()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <!-- Phase 3 / 2A: js/auth.js owns this area (Sign in, or email + Sign out). -->
      <div id="signin-area"></div>
    </div>
  </div>
  <div id="msgs"></div>
  <div id="input-area">
    <div id="input-box">
      <span class="hp-search-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></span>
      <textarea id="inp" rows="1" placeholder="2021 Porsche 911 GT3 Touring"></textarea>
      <button id="btn">↑</button>
    </div>
    <div class="hp-evidence hp-home-only">Real auction results <i>&middot;</i> Platform performance <i>&middot;</i> PowerSeller data</div>
    <div class="hp-value-preview hp-home-only">Built for enthusiast, specialty and collector vehicles</div>
    <!-- PULSE_RAIL: mobile market cards removed with the sidebar section. -->
    <div id="hint"></div>
  </div>
</div>

<!-- JS served at a VERSIONED PATH PREFIX (same reason as styles above: a ?query is
     ignored by some edge caches). The files stay on disk in /js; a vercel.json
     rewrite maps /js.<token>/* back to /js/*. BUMP the token in BOTH index.html
     (every src below) and vercel.json on every js/ change so returning browsers
     fetch fresh code instead of stale cache. -->
<script src="js.20260902c/auth.js"></script>
<script src="js.20260902c/wizard.js"></script>
<script src="js.20260902c/pipeline.js"></script>
<script src="js.20260902c/steps.js"></script>
<script src="js.20260902c/result.js"></script>
<script src="js.20260902c/chat-core.js"></script>
<script src="js.20260902c/result-copy.js"></script>
<script src="js.20260902c/result-v2.js"></script>
<script src="js.20260902c/entry.js"></script>
<script src="js.20260902c/homepage.js"></script>
<!-- Blank-pane watchdog (inline so it cannot itself fail to load): if a bundle
     fetch was blocked, challenged, or dropped, bootHomepage never paints #msgs and
     the main pane stays blank while the nav chrome (auth.js) still renders. This
     grace-timed net shows an honest reload prompt instead of blank white space. It
     only acts when #msgs is genuinely empty, so a rendered hero, wall, or chat never
     triggers it. Not product copy or logic: a last-resort failure signal only. -->
<script>
  window.addEventListener("load", function () {
    setTimeout(function () {
      var m = document.getElementById("msgs");
      if (!m || m.children.length > 0) return;
      m.innerHTML = '<div class="row sam"><div class="row-inner"><div class="msg-wrap">'
        + '<div class="sam-label">Sam</div>'
        + '<div class="sam-text">Something did not load correctly. Reload the page and I\'ll pick up where we left off.</div>'
        + '<div class="sell-rec-actions"><button class="primary" onclick="location.reload()">Reload</button></div>'
        + '</div></div></div>';
    }, 2500);
  });
</script>
</body>
</html>
