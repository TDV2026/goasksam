<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GoAskSam</title>
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<!-- ===================== CURTAIN (pre-launch holding state) =====================
     Temporary. Delete this whole block, the #curtain div below, the .curtain*
     CSS in styles.css, api/crew.js, and the robots.txt Disallow in ONE commit at
     launch. Presentation-level only: it hides the app with CSS and never touches
     auth, the API, or anything 2A built. Unlock: /?crew=<CURTAIN_CREW_CODE>. -->
<meta name="robots" content="noindex, nofollow">
<style>.curtained #rail,.curtained #main,.curtained #hp-hamburger,.curtained #rail-scrim{display:none!important}#curtain{display:none}.curtained #curtain{display:flex}</style>
<script>
(function(){try{
  if(document.cookie.indexOf("gas_crew=ok")!==-1)return;                                 // unlocked device: no curtain
  var m=/[?&]crew=([^&]*)/.exec(location.search||"");
  if(m){location.replace("/api/crew?code="+encodeURIComponent(m[1])+"&to="+encodeURIComponent(location.pathname||"/"));return;}
  document.documentElement.className+=" curtained";                                      // CSS hides the app, shows #curtain
}catch(e){}})();
</script>
<!-- ===================== /CURTAIN ===================== -->
</head>
<body class="home">
<!-- CURTAIN -->
<div id="curtain"><div class="curtain-card">
  <div class="curtain-mark">GoAskSam</div>
  <div class="curtain-line">Launching soon for Daily Vroom readers.</div>
  <a class="curtain-sub" href="https://thedailyvroom.com/subscribe">Not a reader yet? Join free &rarr;</a>
</div></div>
<!-- /CURTAIN -->

<button id="hp-hamburger" aria-label="Menu" onclick="toggleRail()">☰</button>
<div id="rail-scrim" onclick="toggleRail(false)"></div>

<div id="rail">
  <a class="hp-logo" href="/">
    <div class="hp-logo-name">GoAskSam <span class="beta-badge">Beta</span></div>
    <div class="hp-logo-tag">Seller intelligence from The Daily Vroom</div>
  </a>
  <div class="hp-rail-scroll">
    <div class="hp-section">Sell</div>
    <button class="hp-navitem" onclick="setActiveNav(this);startSellFlow()">Sell my car</button>
    <button class="hp-navitem" onclick="setActiveNav(this);showPowerSellerExplainer()">Find a PowerSeller</button>

    <!-- PULSE_RAIL: TODAY'S MARKET sidebar section removed pre-Phase-3. The daily
         pulse pipeline (scripts/refreshDailyPulse.js, lib/dailyPulse.json,
         api/dailyPulse.js, dailyPulseUnit) stays intact and scheduled. Re-enable
         by restoring the section heading + <div id="market-cards-desktop"></div>
         here and the loadDailyPulse() call in js/homepage.js. -->

    <div class="hp-rail-divider"></div>
    <div class="hp-section">Learn</div>
    <button class="hp-navitem" onclick="setActiveNav(this);showHowItWorks()">How Recommendations Work</button>
    <button class="hp-navitem" onclick="setActiveNav(this);showSellingPlatforms()">Selling Platforms</button>
  </div>
  <div class="hp-rail-footer">
    <!-- STAGE_B: referral panel -->
    <button class="hp-navitem stub" data-stage-b="refer" onclick="stageBStub('Refer friends')">Refer friends</button>
    <!-- STAGE_B: profile modal -->
    <button class="hp-navitem stub" data-stage-b="settings" onclick="stageBStub('Settings')">Settings</button>
    <a class="hp-navitem" href="mailto:news@thedailyvroom.com?subject=GoAskSam%20feedback">Feedback</a>
  </div>
</div>

<div id="main">
  <div id="hp-topbar">
    <!-- Phase 3 / 2A: js/auth.js owns this area (Sign in, or email + Sign out). -->
    <div id="signin-area"></div>
  </div>
  <div id="msgs"></div>
  <div id="input-area">
    <div class="hp-input-label hp-home-only">What are you selling?</div>
    <div id="input-box">
      <textarea id="inp" rows="1" placeholder="2018 Porsche 911 Carrera GTS"></textarea>
      <button id="btn">↑</button>
    </div>
    <div class="hp-reassurance hp-home-only">Recommendations are based on recent sales, seller performance and market trends.</div>
    <!-- PULSE_RAIL: mobile market cards removed with the sidebar section. -->
    <div id="hint"></div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/wizard.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/steps.js"></script>
<script src="js/result.js"></script>
<script src="js/chat-core.js"></script>
<script src="js/result-copy.js"></script>
<script src="js/entry.js"></script>
<script src="js/homepage.js"></script>
</body>
</html>
