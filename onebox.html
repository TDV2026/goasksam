<!-- Internal review surface, DARK behind the crew/tester gate (the VIN-launch pattern):
     a device holding gas_tester=ok or gas_crew=ok is let in; anything else is sent home.
     Invite links: /onebox?tester=<code> / /onebox?crew=<code>. Launch = flip the gate to
     public (a later, separate T1.6 step); rollback = restore the gate. noindex at launch. -->
<script>
(function(){try{
  var c=document.cookie||"";
  // Crew/tester device: in immediately, no flag fetch.
  if(c.indexOf("gas_tester=ok")!==-1||c.indexOf("gas_crew=ok")!==-1)return;
  // Invite code in the URL: exchange it (existing behavior), preserving query + hash.
  var m=/[?&](tester|crew)=([^&]*)/.exec(location.search||"");
  if(m){var q=m[1]==="tester"?"tcode":"code";location.replace("/api/crew?"+q+"="+encodeURIComponent(m[2])+"&to="+encodeURIComponent((location.pathname||"/onebox")+(location.search||"")+(location.hash||"")));return;}
  // Not crew: gate on the public-launch flag (app_config onebox_public via publicConfig).
  // Hide the page until the flag resolves so no content flashes. Public -> reveal; not
  // public -> home. Instant rollback: set onebox_public=0 and non-crew visitors bounce.
  document.documentElement.style.visibility="hidden";
  // Cache-bust so the gate ALWAYS reads the flag fresh (publicConfig is edge-cached ~2min
  // for the /sell auth path; the gate must not lag). This keeps both the flip and the
  // rollback instant: set onebox_public=0 and the very next non-crew load bounces.
  fetch("/api/publicConfig?ob="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
    if(d&&d.oneboxPublic){document.documentElement.style.visibility="";}
    else{location.replace("/");}
  }).catch(function(){location.replace("/");});
}catch(e){location.replace("/");}})();
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" />
<style>
/* ============ One Box design of record (Oct 2026 mockup: Main / Phone / Vin / Thin / Question) ============
   Light only. Two faces: Newsreader (range, headings, prices, Sam's Take) and Instrument Sans (all else).
   No monospace anywhere. Body 15px+, secondary 14px+, only eyebrows and pills at 12-13px. */
:root{
  --page:#F6F3EC; --card:#FFFFFF; --border:#DCD8CC; --ink:#15201A; --green:#1E4D38; --green-dk:#15372A;
  --sec:#5E6B63; --div:#E2DED3; --take:#F1F5F1; --live:#2E8B57; --ph:#E6E2D8; --ph-ink:#4A564F;
  --soft:#3C4942; --chip:#C9D6CC; --tint:#EDF3EE; --tint-line:#D5E2D8;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--green)}a:hover{color:var(--green-dk)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.linkbtn{background:none;border:0;padding:0;color:var(--green);font:600 15px/1.4 var(--sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.linkbtn:hover{color:var(--green-dk)}

/* ---- shell: left rail + main column ---- */
#ob-rail{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--page);border-right:1px solid var(--div);display:flex;flex-direction:column;padding:28px 24px 20px;z-index:50}
.ob-logo{text-decoration:none;display:block;margin:0 0 22px;font:600 26px/1.1 var(--serif);letter-spacing:-.01em;color:var(--ink)}
.ob-rail-nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow:auto}
.ob-navitem{display:flex;align-items:center;min-height:44px;text-decoration:none;color:var(--sec);font:400 15px/1.3 var(--sans);padding:0 14px;border-left:2px solid transparent;cursor:pointer}
.ob-navitem:hover{color:var(--ink)}
.ob-navitem.active{color:var(--green);font-weight:600;border-left-color:var(--green);padding-left:12px}
.ob-rail-foot{display:flex;flex-direction:column;border-top:1px solid var(--div);padding-top:10px;margin-top:12px}
.ob-rail-foot .ob-navitem{font-size:14px}
.ob-submenu{display:none;flex-direction:column;margin:0 0 4px 14px;border-left:1px solid var(--div)}
.ob-submenu.open{display:flex}
.ob-submenu a{display:flex;align-items:center;min-height:40px;font:400 14px/1.3 var(--sans);color:var(--sec);text-decoration:none;padding:0 12px;cursor:pointer}
.ob-submenu a:hover{color:var(--ink)}
#ob-main{margin-left:240px}
.ob-mhead{display:none}
#ob-scrim{display:none;position:fixed;inset:0;background:rgba(21,32,26,.36);z-index:45}
#ob-scrim.open{display:block}
.ob-topbar{display:flex;justify-content:flex-end;padding:18px 48px 0;min-height:18px}
.ob-leadbar{margin:0;padding:6px 48px 0;font:400 13px/1.4 var(--sans);color:var(--sec);text-align:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--div);display:grid;place-items:center;font:600 13px var(--sans);color:var(--sec)}
.wrap{padding:10px 48px 56px;display:flex;justify-content:center}
#ob{width:100%;max-width:860px;display:flex;flex-direction:column;gap:28px}

/* ---- empty state ---- */
.ob-home{min-height:calc(100dvh - 150px);display:flex;flex-direction:column;justify-content:center;gap:0;max-width:640px}
.ob-tag{margin:0;font:500 14px/1.4 var(--sans);color:var(--sec)}
.ob-head{font:600 46px/1.08 var(--serif);letter-spacing:-.02em;margin:14px 0 0;text-wrap:balance}
.ob-sub{margin:12px 0 24px;font:400 20px/1.45 var(--serif);color:var(--soft);max-width:32ch}
.ob-cue{margin:14px 2px 0;font:400 15px/1.4 var(--sans);color:var(--sec)}

/* ---- search box ---- */
.inbox{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px 8px 8px 20px;box-shadow:0 1px 2px rgba(21,32,26,.04)}
.inbox input{flex:1;min-width:0;border:0;outline:0;font:400 19px/1.4 var(--sans);color:var(--ink);background:transparent}
.inbox input::placeholder{color:var(--sec)}
.inbox .go{width:48px;height:48px;flex:none;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:22px;cursor:pointer}
.inbox .go:hover{background:var(--green-dk)}

/* ---- resolved car line ---- */
.carline{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font:400 15px/1.4 var(--sans);color:var(--sec);margin:-4px 0 -8px}
.vinpill,.pill{display:inline-block;border-radius:999px;font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.vinpill{padding:6px 10px;background:var(--green);color:#fff}

/* ---- answer card ---- */
.anscard{background:var(--card);border:1px solid var(--border);border-radius:16px;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));overflow:hidden}
.ans-main{grid-column:span 7;padding:26px 28px 24px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--div)}
.anscard.solo .ans-main{grid-column:1 / -1;border-right:0}
.eyebrow{font:600 13px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--sec)}
.range{margin:0;font:600 40px/1.1 var(--serif);color:var(--green);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.range .to{font-weight:400;font-size:26px;color:var(--sec)}
.landed{margin:0;font:400 20px/1.4 var(--serif);color:var(--ink)}
/* ---- range bar (Oct 2026): full spread, typical band highlighted, labelled ends ---- */
.rangebar{margin-top:2px}
.rb-row{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"lo track hi";align-items:center;gap:10px}
.rb-end{font:400 13px/1 var(--sans);color:var(--sec);font-variant-numeric:tabular-nums;white-space:nowrap}
.rb-lo{grid-area:lo}
.rb-hi{grid-area:hi;text-align:right}
.rb-track{grid-area:track;position:relative;height:4px;background:var(--border);border-radius:2px}
.rb-band{position:absolute;top:0;height:4px;background:var(--green);border-radius:2px}
.ans-lead{margin:0;font:400 24px/1.38 var(--serif);color:var(--ink);text-wrap:pretty}
.fresh{display:flex;gap:10px;align-items:center;font:400 14px/1.4 var(--sans);color:var(--sec);margin-top:4px}
.fresh .dot{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none}
.ans-line{margin:0;font:400 15px/1.5 var(--sans);color:var(--soft)}
.take{grid-column:span 3;padding:24px 22px 22px;background:var(--take);display:flex;flex-direction:column;gap:8px}
.take-h{display:flex;gap:10px;align-items:center}
.roundel{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--green);color:var(--green);font:600 10px/1 var(--sans);letter-spacing:.08em;display:flex;align-items:center;justify-content:center}
.roundel.lg{width:40px;height:40px;font-size:11px}
.take-tag{font:600 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.take p{margin:0;font:400 17px/1.45 var(--serif);color:var(--soft)}

/* ---- notes under the answer (engine-gated secondary lines) ---- */
.notes{display:flex;flex-direction:column;gap:8px;margin-top:-8px}
.notes p{margin:0;font:400 17px/1.5 var(--serif);color:var(--soft)}
.notes .num{font-weight:600;color:var(--ink)}

/* ---- section head ---- */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:14px;margin-top:6px;border-top:1px solid var(--border)}
.sec-head h2{margin:0;font:500 22px/1.25 var(--serif)}
.sec-head .scope{display:block;font:400 14px/1.45 var(--sans);color:var(--sec);margin-top:2px}
.sec-head .linkbtn{white-space:nowrap}
.sep-note{margin:0;font:400 15px/1.5 var(--sans);color:var(--sec);max-width:68ch}
/* ---- long-list cap (Oct 2026): extra cards server-render, just hidden until "Show 10 more" ---- */
.cap-extra[hidden]{display:none}
.cap-extra:not([hidden]){display:contents}
.capshow{margin-top:14px}

/* ---- cards ---- */
.cards5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
a.card:hover{border-color:var(--green)}
a.card:hover .ctitle{text-decoration:underline;text-underline-offset:3px}
.card.hero{grid-column:span 3}
.cards5.single .card.hero{grid-column:1 / -1}
.card.this{border:1.5px solid var(--green)}
.stack{grid-column:span 2;display:flex;flex-direction:column;gap:20px}
.stack .card{flex:1 1 0}
.ph{position:relative;background:var(--ph);flex:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ph-ink)}
.ph img+.none{display:none}
.ph.noimg .none{display:flex}
.hero .ph{height:300px}
.card.sm .ph{height:112px}
.pill{position:absolute;top:14px;left:14px;padding:6px 12px;background:var(--green);color:#fff}
.card.sm .pill{top:10px;left:10px;padding:5px 9px;background:var(--card);color:var(--green)}
.cbody{padding:18px 22px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.card.sm .cbody{padding:10px 14px 12px;gap:3px}
.price-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.cprice{font:600 32px/1 var(--serif);font-variant-numeric:tabular-nums}
.card.sm .cprice{font-size:22px}
.cvenue{font:400 14px/1.4 var(--sans);color:var(--sec)}
.ctitle{font:500 17px/1.35 var(--sans);color:var(--ink)}
.card.sm .ctitle{font-size:15px;line-height:1.3}
.cmeta{font:400 14px/1.45 var(--sans);color:var(--sec)}
.callin{font:400 14px/1.4 var(--sans);color:var(--sec)}
.cwhy{margin:4px 0 0;font:italic 400 16px/1.45 var(--serif);color:var(--soft)}
.histlink{margin-top:4px;font:600 15px/1.4 var(--sans);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center;align-self:flex-start}
.mk{display:inline-block;font:600 12px/1 var(--sans);letter-spacing:.04em;color:var(--green);background:var(--tint);border:1px solid var(--tint-line);border-radius:999px;padding:5px 9px;margin:4px 6px 0 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid2 .ph{height:200px}
.grid2 .cprice{font-size:26px}
.grid2 .ctitle{font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid3 .ph{height:140px}
.grid3 .cprice{font-size:22px}
.grid3 .cbody{padding:12px 16px 14px;gap:4px}
.grid3 .ctitle{font-size:15px}

/* ---- question card (inside a result) + question screen ---- */
.qcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 22px;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.qcard .q{margin:0;font:400 20px/1.35 var(--serif)}
.qcard .rc-sub{flex-basis:100%;margin:-4px 0 0;font:400 15px/1.45 var(--sans);color:var(--sec)}
.qchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qchip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--chip);background:var(--card);color:var(--ink);font:500 15px var(--sans);cursor:pointer}
.qchip:hover,.qchip.sel{border-color:var(--green);color:var(--green)}
.qchip.typeit{border-style:dashed;color:var(--sec)}
.typemiles{display:inline-flex;gap:8px;align-items:center}
.typemiles input{width:120px;min-height:44px;border:1px solid var(--chip);border-radius:999px;padding:0 16px;font:500 15px var(--sans);color:var(--ink);background:var(--card);outline:none}
.typemiles input:focus{border-color:var(--green)}
.qscreen{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px 28px 28px;display:flex;gap:18px}
.qscreen .qbody{display:flex;flex-direction:column;gap:16px;min-width:0}
.qscreen .qtop{display:flex;flex-direction:column;gap:6px}
.qscreen .eyebrow{color:var(--green)}
.qtext{margin:0;font:400 28px/1.3 var(--serif);text-wrap:pretty}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{min-height:48px;padding:0 24px;border-radius:999px;border:1.5px solid var(--green);background:var(--card);color:var(--green);font:600 17px var(--sans);cursor:pointer}
.chip:hover{background:var(--green);color:#fff}
.chip.ghost{border-style:dashed;border-color:var(--chip);color:var(--sec);font-weight:500}
.chip.ghost:hover{background:var(--card);border-color:var(--green);color:var(--green)}
.qsub{font:400 15px/1.4 var(--sans);color:var(--sec)}
.trustline{display:flex;gap:10px;align-items:center;font:400 15px/1.4 var(--sans);color:var(--sec);padding-top:14px;border-top:1px solid var(--div)}
.trustline .dot{width:9px;height:9px;border-radius:50%;background:var(--live);flex:none}

/* ---- Sam message (errors, VIN confirm, refusal reasons): a card with the roundel, never a Take panel ---- */
.sam{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 24px;display:flex;gap:16px;align-items:flex-start}
.sam .body{display:flex;flex-direction:column;gap:10px;min-width:0}
.sam .tag{font:600 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.sam p{margin:0;font:400 19px/1.45 var(--serif);color:var(--ink)}
.sam.big p{font-size:24px;line-height:1.35}
.refusal{display:flex;flex-direction:column;gap:20px}
.refusal .ans{margin:0;font:400 30px/1.3 var(--serif);max-width:26ch;text-wrap:balance}
.wayfwd{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---- thin ---- */
.thin-head{margin:0;font:400 30px/1.3 var(--serif);text-wrap:pretty}
.thin-head .ct{font-weight:600;color:var(--green)}
.thinblk{display:flex;flex-direction:column;gap:12px}
.thinblk .fresh{font-size:15px;margin-top:0}
.thinblk .ans-line{font-size:15px}
.widen{background:var(--tint);border:1px solid var(--tint-line);border-radius:14px;padding:18px 22px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.widen p{margin:0;font:400 19px/1.4 var(--serif)}
.widen button{min-height:44px;padding:0 16px;border:1.5px solid var(--green);border-radius:999px;background:var(--card);color:var(--green);font:600 16px var(--sans);cursor:pointer}
.widen button:hover{background:var(--green);color:#fff}

/* ---- live panel (cars in this family live right now) ---- */
.livepanel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 22px;display:flex;flex-direction:column;gap:6px}
.livepanel .lp-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.livepanel h2{margin:0;font:500 20px/1.3 var(--serif);display:flex;align-items:center;gap:10px}
.livepanel h2 .dot{width:9px;height:9px;border-radius:50%;background:var(--live);flex:none}
.lp-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--div);text-decoration:none;color:inherit}
.lp-row:first-of-type{border-top:0}
.lp-row:hover .lp-t{text-decoration:underline;text-underline-offset:3px}
.lp-house{font:600 14px/1.2 var(--sans);color:var(--green)}
.lp-t{font:500 15px/1.35 var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-r{text-align:right;font:400 14px/1.4 var(--sans);color:var(--sec);white-space:nowrap}
.lp-r b{display:block;font:600 17px/1.2 var(--serif);color:var(--ink)}
/* ---- why it looks like this ---- */
.whynote{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.whynote .eyebrow{color:var(--sec)}
.whynote p{margin:0;font:400 15px/1.55 var(--sans);color:var(--sec);max-width:68ch}
.whynote a{font:600 15px/1.4 var(--sans);min-height:44px;display:inline-flex;align-items:center;align-self:flex-start}
@media (max-width:640px){.lp-row{grid-template-columns:minmax(0,1fr) auto}.lp-house{grid-column:1 / -1}.livepanel{padding:16px}}
/* ---- ready to sell ---- */
.sellbox{background:var(--green);color:#fff;border-radius:14px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.sellbox .st{display:flex;flex-direction:column;gap:4px}
.sellbox h3{margin:0;font:600 24px/1.2 var(--serif)}
.sellbox p{margin:0;font:400 16px/1.45 var(--sans);color:#D5E2D8}
.sellbox a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:10px;background:#fff;color:var(--green);font:600 16px var(--sans);text-decoration:none}
.sellbox a:hover{background:var(--tint);color:var(--green-dk)}

/* ---- loader ---- */
.loader{display:flex;align-items:baseline;gap:4px;font:500 15px/1.5 var(--sans);color:var(--sec)}
.loader .ldots{display:inline-flex;gap:3px;margin-left:2px}
.loader .ldots i{width:4px;height:4px;border-radius:50%;background:var(--green);display:inline-block;animation:obdot 1.1s ease-in-out infinite}
.loader .ldots i:nth-child(2){animation-delay:.18s}
.loader .ldots i:nth-child(3){animation-delay:.36s}
@keyframes obdot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.loader .ldots i{animation:none;opacity:.6}}

/* ---- streaming stages ---- */
[data-stage]{opacity:1;transform:none;transition:opacity .28s ease,transform .28s ease}
[data-stage].stage-pending{opacity:0;transform:translateY(6px)}
@media (prefers-reduced-motion:reduce){[data-stage]{transition:none}[data-stage].stage-pending{opacity:1;transform:none}}

/* ---- tablet / phone ---- */
@media (max-width:860px){
  #ob-rail{width:260px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 22px 56px rgba(21,32,26,.18);background:var(--card)}
  #ob-rail.open{transform:none}
  #ob-main{margin-left:0}
  .ob-mhead{display:flex;justify-content:space-between;align-items:center;padding:20px 16px 0}
  .ob-mhead .brand{font:600 22px/1 var(--serif);color:var(--ink);text-decoration:none}
