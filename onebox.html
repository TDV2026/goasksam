<head>
<meta charset="UTF-8" />

<link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<!-- Internal review surface, DARK behind the crew/tester gate (the VIN-launch pattern):
     a device holding gas_tester=ok or gas_crew=ok is let in; anything else is sent home.
     Invite links: /onebox?tester=<code> / /onebox?crew=<code>. Launch = flip the gate to
     public (a later, separate T1.6 step); rollback = restore the gate. noindex at launch. -->
<script>
(function(){try{
  var c=document.cookie||"";
  // Crew/tester device: in immediately, no flag fetch.
  if(c.indexOf("gas_tester=ok")!==-1||c.indexOf("gas_crew=ok")!==-1)return;
  // Invite code in the URL: exchange it (existing behavior), preserving query + hash.
  var m=/[?&](tester|crew)=([^&]*)/.exec(location.search||"");
  if(m){var q=m[1]==="tester"?"tcode":"code";location.replace("/api/crew?"+q+"="+encodeURIComponent(m[2])+"&to="+encodeURIComponent((location.pathname||"/onebox")+(location.search||"")+(location.hash||"")));return;}
  // Not crew: gate on the public-launch flag (app_config onebox_public via publicConfig).
  // Hide the page until the flag resolves so no content flashes. Public -> reveal; not
  // public -> home. Instant rollback: set onebox_public=0 and non-crew visitors bounce.
  document.documentElement.style.visibility="hidden";
  // Cache-bust so the gate ALWAYS reads the flag fresh (publicConfig is edge-cached ~2min
  // for the /sell auth path; the gate must not lag). This keeps both the flip and the
  // rollback instant: set onebox_public=0 and the very next non-crew load bounces.
  fetch("/api/publicConfig?ob="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
    if(d&&d.oneboxPublic){document.documentElement.style.visibility="";}
    else{location.replace("/");}
  }).catch(function(){location.replace("/");});
}catch(e){location.replace("/");}})();
</script>
<style>
/* ============ Paddock palette (the approved /onebox-preview design of record) ============ */
:root{
  --paper:#f4f1ea; --card:#fffdf9; --ink:#191410; --slate:#665f52; --faint:#928b7a;
  --line:#e4ddcd; --line2:#eee7d9; --green:#0b5c3e; --green-btn:#136141; --green-deep:#0b3f2b; --clay:#a4571f;
  --shadow:0 1px 2px rgba(40,30,10,.05),0 10px 30px rgba(40,30,10,.06);
  --shadow-hero:0 2px 4px rgba(40,30,10,.06),0 22px 56px rgba(11,92,62,.11);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --grotesk:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{--paper:#14110a;--card:#1e1a11;--ink:#efe7d6;--slate:#a49c8a;--faint:#7c7565;--line:#332c1e;--line2:#2a2418;--green:#79c9a4;--green-btn:#137048;--green-deep:#8fd4b3;--clay:#d3944f;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);--shadow-hero:0 2px 4px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{--paper:#14110a;--card:#1e1a11;--ink:#efe7d6;--slate:#a49c8a;--faint:#7c7565;--line:#332c1e;--line2:#2a2418;--green:#79c9a4;--green-btn:#137048;--green-deep:#8fd4b3;--clay:#d3944f;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);--shadow-hero:0 2px 4px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.5);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--grotesk);-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---- top bar ---- */
.top{max-width:1040px;margin:0 auto;padding:22px 28px 0;display:flex;align-items:center;gap:20px}
.brand{font:800 19px/1 var(--serif);letter-spacing:-.01em}
.brand .ob{font:600 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-left:12px}
.top nav{margin-left:auto;display:flex;align-items:center;gap:22px;font-size:14.5px;color:var(--slate)}
.top nav a{color:var(--slate);text-decoration:none}
.top nav a:hover{color:var(--ink)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;font:600 12px var(--mono);color:var(--slate)}

.wrap{max-width:1040px;margin:0 auto;padding:20px 28px 90px}

/* ---- headline / input ---- */
h1{font:800 48px/1.04 var(--serif);letter-spacing:-.025em;margin:14px 0 8px;text-wrap:balance}
.lede{color:var(--slate);font-size:17px;margin:0 0 26px}
.inbox{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 15px 15px 22px}
.inbox input{flex:1;border:0;background:transparent;color:var(--ink);font:400 18.5px/1.4 var(--grotesk);outline:none;letter-spacing:-.01em}
.inbox input::placeholder{color:var(--faint)}
.inbox .cam{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--slate);display:grid;place-items:center;flex:none;cursor:default}
.inbox .go{width:46px;height:46px;border-radius:11px;background:var(--green-btn);color:#fff;border:0;display:grid;place-items:center;flex:none;cursor:pointer;font-size:19px}

/* ---- Sam blocks ---- */
.sam{display:flex;gap:15px;align-items:flex-start;background:color-mix(in srgb,var(--green) 5%,var(--card));border:1px solid color-mix(in srgb,var(--green) 16%,var(--line));border-radius:14px;padding:18px 20px;margin:20px 0}
.sam .ava{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--green);display:grid;place-items:center;font:600 10px var(--mono);letter-spacing:.04em;color:var(--green)}
.sam .body{flex:1}
.sam .tag{font:600 11px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
.sam p{margin:0;font:400 16.5px/1.55 var(--serif);color:var(--ink);max-width:66ch}
.sam p+p{margin-top:9px}
.sam .edit{flex:none;align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 17px;font:600 14px var(--grotesk);color:var(--ink);cursor:pointer}
.sam.note{background:color-mix(in srgb,var(--green) 4%,var(--card))}

/* ---- VIN exact-match ANCHOR beat (Task 2): callout + photo + receipt, then a bridge ---- */
.anchor{margin:20px 0 0}
.anchor .vin-photo{position:relative;width:100%;max-width:340px;aspect-ratio:16/10;margin:14px 0 4px;border-radius:12px;overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.anchor .vin-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vin-plate{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;gap:6px;padding:16px 18px;background:var(--paper);background-image:linear-gradient(var(--line2) 1px,transparent 1px);background-size:100% 9px}
.vin-plate .m{font:600 9px/1.1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--green)}
.vin-plate .n{font:800 14px/1.2 var(--grotesk);color:var(--ink);letter-spacing:-.01em}
.vin-plate .s{font:600 8.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.anchor-receipt{display:inline-block;margin-top:4px;font:600 14px var(--grotesk);color:var(--green);text-decoration:none;border-bottom:1.5px solid currentColor}
.anchor-receipt:hover{opacity:.8}
.bridge{margin:16px 2px 0;font:400 17px/1.5 var(--serif);color:var(--slate)}

/* ---- working line (streaming, pre-answer stage) ---- */
.working{display:flex;align-items:center;gap:10px;margin:26px 0 6px;font:600 13px/1 var(--mono);letter-spacing:.03em;color:var(--slate)}
.working .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:obpulse 1s ease-in-out infinite}
@keyframes obpulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.working .pulse{animation:none}}

/* ---- answer line ---- */
.answer{font:400 34px/1.28 var(--serif);letter-spacing:-.018em;margin:30px 0 10px;max-width:22ch;text-wrap:balance}
.answer .num{font-weight:600;color:var(--green-deep)}
.meta-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 6px}
.basis{font:600 12px/1 var(--mono);letter-spacing:.03em;color:var(--slate)}
.basis .dot{color:var(--faint);margin:0 6px}
.utils{margin-left:auto;display:flex;gap:6px}
.util{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font:600 12.5px var(--grotesk);color:var(--slate);cursor:pointer}
.util:hover{border-color:var(--green);color:var(--green)}
.util svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.whyrow{display:flex;justify-content:flex-end;margin:16px 0 12px}
.why{display:inline-flex;align-items:center;gap:7px;color:var(--slate);font:600 13px var(--grotesk);cursor:pointer;background:none;border:0}
.why:hover{color:var(--green)}
.why .i{width:17px;height:17px;border-radius:50%;border:1.4px solid currentColor;display:grid;place-items:center;font:700 11px var(--serif)}

/* ---- cards ---- */
.grid{display:grid;grid-template-columns:1.02fr .98fr;gap:18px;align-items:start}
.rightcol{display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card.hero{border:1.5px solid color-mix(in srgb,var(--green) 40%,var(--line));box-shadow:var(--shadow-hero)}
.ph{position:relative;background:#0c0a06;aspect-ratio:16/10}
.hero .ph{aspect-ratio:16/11}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plate{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;gap:6px;padding:16px 18px;background:var(--paper);background-image:linear-gradient(var(--line2) 1px,transparent 1px);background-size:100% 9px}
.plate .m{font:600 9px/1.1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--green)}
.plate .n{font:800 14px/1.2 var(--grotesk);color:var(--ink);letter-spacing:-.01em}
.plate .s{font:600 8.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.tab{position:absolute;top:14px;left:14px;z-index:2;font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:7px 11px;border-radius:6px}
.tab.match{background:var(--green);color:#fff}
.tab.diff{background:var(--card);color:var(--slate);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){.tab.match{color:#0c130f}}
.cbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:0}
.solds{display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 12.5px/1 var(--mono);color:var(--slate)}
.solds .plat{color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.solds .plat svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.price{font:700 30px/1 var(--mono);letter-spacing:-.02em;margin:11px 0 0;font-variant-numeric:tabular-nums}
.hero .price{font-size:34px}
.usd{font:600 12.5px/1 var(--mono);color:var(--slate);margin-top:5px}
.prem{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--clay);margin-top:7px}
.miles{font:600 14px/1 var(--mono);color:var(--ink);margin-top:9px}
.cspec{font:400 13.5px/1.3 var(--grotesk);color:var(--slate);margin-top:5px}
.viewsale{margin-top:15px;display:block;text-align:center;text-decoration:none;border:1.5px solid var(--green);color:var(--green);border-radius:10px;padding:12px 14px;font:600 14.5px var(--grotesk)}
.viewsale:hover{background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.viewsale:hover{color:#0c130f}}

/* ---- refine + CTA + chips + recent + foot ---- */
.refine{margin:22px 0 0;border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--card)}
.refine .r-lead{font:400 16px/1.5 var(--serif);color:var(--ink);margin:0 0 12px}
.refine input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:13px 15px;font:400 15px var(--grotesk);color:var(--ink);outline:none}
.refine input::placeholder{color:var(--faint)}
.sell{margin:26px 0 0;border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--card)}
.sell h3{margin:0 0 4px;font:800 21px/1.1 var(--serif);letter-spacing:-.01em}
.sell p{margin:0;color:var(--slate);font-size:14.5px}
.sell a{flex:none;background:var(--green-btn);color:#fff;text-decoration:none;border-radius:12px;padding:15px 24px;font:700 16px var(--grotesk);letter-spacing:-.01em;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:11px;margin:22px 0 0}
.chip{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:22px;padding:12px 22px;font:600 15.5px var(--grotesk);cursor:pointer;letter-spacing:-.01em}
.chip:hover{border-color:var(--green);color:var(--green)}
.proof{margin:26px 0 0;font:400 17px/1.6 var(--serif);color:var(--slate);max-width:52ch}
.recent{margin:34px 0 0}
.recent .rh{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.recent .rh h4{margin:0;font:800 14px var(--grotesk);letter-spacing:.01em}
.recent .rh a{color:var(--green);font:600 13px var(--grotesk);text-decoration:none;cursor:pointer}
.rcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rc{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer}
.rc .th{width:46px;height:34px;border-radius:6px;background:var(--line2);flex:none;overflow:hidden}
.rc .th img{width:100%;height:100%;object-fit:cover}
.rc .t{font:700 13px/1.25 var(--grotesk)}
.rc .u{font:600 11px/1.2 var(--mono);color:var(--faint);margin-top:3px}
.foot{margin:36px 2px 0;padding-top:16px;border-top:1px solid var(--line);color:var(--faint);font:600 12.5px/1 var(--mono);letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.foot svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}

/* ---- streaming stages: hidden until revealed in sequence ---- */
[data-stage].stage-pending{opacity:0;transform:translateY(6px)}
[data-stage]{opacity:1;transform:none;transition:opacity .28s ease,transform .28s ease}
@media (prefers-reduced-motion:reduce){[data-stage]{transition:none}[data-stage].stage-pending{opacity:1;transform:none}}

@media (max-width:720px){
  .top{padding:16px 18px 0}
  .top nav a:not(.keep){display:none}
  .wrap{padding:16px 18px 70px}
  h1{font-size:34px}
  .answer{font-size:26px}
  .grid{grid-template-columns:1fr}
  .rcards{grid-template-columns:1fr 1fr}
  .utils{margin-left:0;width:100%}
  .meta-row{gap:10px}
  .sam{flex-wrap:wrap}
  .sam .edit{margin-top:4px}
  .sell{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<header class="top">
  <span class="brand">GoAskSam<span class="ob">One Box</span></span>
  <nav><a href="/how-sam-decides" class="keep" target="_blank" rel="noopener">How it works</a><span class="avatar">SW</span></nav>
</header>
<main class="wrap"><div id="ob"></div></main>
