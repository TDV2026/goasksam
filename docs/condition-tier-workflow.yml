# Condition tier job (Lane B, Nov 2026). COPY to .github/workflows/condition-tier.yml (the CI PAT lacks the workflow scope, so Sam adds it). REPLACES the Nov 5 copy.
# Prereq, once in the Supabase SQL editor: docs/supabase-condition-tier.sql. ZERO OldCarsData. Resumable: only rows not at the current tier version are touched, a cancelled run leaves no half written row.
# Safe against the live site: batches of 100 with a 2 s pause, every request aborted after 6 s, a slow batch doubles the pause, 3 slow batches in a row (or one over 15 s) STOP the run with a warning,
# and every run is bounded by --max rows and --minutes. A max, batch or pause that is not a whole number FAILS the run; nothing means "all rows".
# SCHEDULE: 10:50 UTC. The 07:11 ingest and the jobs that wait on it (premium, cube) are done, the 08:00 depth, 09:40/09:50 photo checks and 10:20 admin night refresh have run, and the 12:00 cache fill has not started.
#   About 3:50 am Pacific, before the US morning. A run is capped at 70 minutes, so it ends before the 12:00 fill.
# FULL BACKFILL: let the nightly run do it (50,000 rows a night, resumes where it stopped), or dispatch by hand with batch 100, pause 2000, max 2000000, minutes 70, and rerun until the log says "finished, 0 rows".
name: Condition tier
on:
  workflow_dispatch:
    inputs:
      batch:   { description: "Rows per batch, a whole number 25 to 500", required: false, default: "100" }
      pause:   { description: "Pause between batches, ms, a whole number", required: false, default: "2000" }
      max:     { description: "Stop after this many rows, a whole number 1 to 2000000 (no 0, no text)", required: false, default: "5000" }
      minutes: { description: "Stop after this many minutes, a whole number 1 to 300", required: false, default: "70" }
  schedule:
    - cron: "50 10 * * *"
concurrency:
  group: condition-tier
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  tier:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Assign tiers
        run: node scripts/assignConditionTier.mjs --batch="${{ github.event.inputs.batch || '100' }}" --pause="${{ github.event.inputs.pause || '2000' }}" --max="${{ github.event.inputs.max || '50000' }}" --minutes="${{ github.event.inputs.minutes || '70' }}"
