name: Nightly ingest and warm

# 7D/7E: the version-controlled nightly mechanism (there are no Vercel crons in
# vercel.json). GitHub Actions runs the delta ingest and the rolling warm.
#
# This is the copy of record for .github/workflows/nightly.yml. The CI token lacks
# the `workflow` scope, so Sam applies changes here via the GitHub web editor: open
# .github/workflows/nightly.yml, replace its contents with this file, commit.
#
# The secrets below are GitHub Actions secrets, which are SEPARATE from the
# Vercel env vars. Add them under: repo Settings > Secrets and variables > Actions.
# If they are missing, the "Verify required secrets" step fails loudly and names
# exactly which one is empty.
#
# JOB SHAPE (Oct 2026, nightly-timing follow-up - run #105, Oct 9, cancelled at the
# 55-minute ceiling mid crossProductCheck, taking warm/attempts/premium/cube down
# with it since all four `needs: ingest`): "ingest" is now LEAN - archive freshness
# only, nothing else - so warm/attempts/premium/cube (all archive-freshness
# consumers, nothing more) start the moment it finishes, typically under a minute.
# Every slower, non-essential step (VIN index, spec cache refresh + its deferred
# recompute, the Market Check/Sell example builds, spec_pages, VIN rollout cache,
# the search rules check, crossProductCheck) moved to a NEW "caches" job that runs
# AFTER ingest but IN PARALLEL with warm/attempts/premium/cube, with its own
# generous timeout - a slow night in "caches" can no longer block anything else.
on:
  schedule:
    - cron: "11 7 * * *"   # 07:11 UTC nightly (off-peak minute; :30/:00 top-of-hour slots see the worst GitHub scheduler delay)
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Backfill start date YYYY-MM-DD (blank = nightly delta)"
        required: false
      backfill_to:
        description: "Backfill end date YYYY-MM-DD (blank = same as start)"
        required: false
      sources:
        description: "Comma-separated OCD slugs (blank = all 19)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ingest:
    # Pinned to 24.04 so the ubuntu-latest migration to Ubuntu 26 (from Oct 19) cannot change the runner under us.
    runs-on: ubuntu-24.04
    # LEAN now (Oct 2026 follow-up): this job is archive ingest ONLY - every other step that used to
    # live here moved to the "caches" job below. A normal delta finishes in well under a minute; 25
    # min is a hard ceiling (generous headroom over a large backfill dispatch) so a runaway can never
    # walk for an hour again, and - just as importantly - can never hold warm/attempts/premium/cube
    # hostage, since none of those depend on anything slower than this.
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OLDCARSDATA_API_KEY: ${{ secrets.OLDCARSDATA_API_KEY }}
      BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
      BACKFILL_TO: ${{ github.event.inputs.backfill_to }}
      SOURCES: ${{ github.event.inputs.sources }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify required secrets are present
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY OLDCARSDATA_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Actions secret ${name} is EMPTY. Add it under Settings > Secrets and variables > Actions (these are separate from Vercel env vars)."
              missing=1
            else
              echo "${name}: present"
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::Aborting: one or more required secrets are missing."
            exit 1
          fi
      - name: Ingest (backfill range if provided, else nightly delta)
        run: |
          set -euo pipefail
          node --version
          test -f scripts/ingest.js || { echo "::error::scripts/ingest.js not found in checkout"; exit 1; }
          if [ -n "${BACKFILL_FROM:-}" ]; then
            TO="${BACKFILL_TO:-$BACKFILL_FROM}"
            echo "Backfill ingest: ${BACKFILL_FROM} .. ${TO} sources=${SOURCES:-all}"
            node scripts/ingest.js --from="${BACKFILL_FROM}" --to="${TO}" ${SOURCES:+--sources="$SOURCES"}
          else
            echo "Nightly delta ingest"
            node scripts/ingest.js --delta
          fi
      # ingest.js writes this file (repo root) only when this run invalidated spec_market_cache
      # rows; absent = nothing to recompute. Uploaded so the "caches" job (a separate runner) can
      # pick it up - the recompute itself never runs in THIS job, per the Oct 2026 fix above.
      - name: Upload invalidated specs list (if any) for the deferred recompute
        uses: actions/upload-artifact@v4
        with:
          name: invalidated-specs
          path: invalidated-specs.json
          if-no-files-found: ignore
          retention-days: 1

  caches:
    runs-on: ubuntu-24.04
    needs: ingest
    # Every step here is a cache/freshness nice-to-have, never archive correctness - a failure or a
    # slow night here must never read as an ingest outage, and (the whole point of this split) must
    # never delay warm/attempts/premium/cube, none of which need anything in this job. 55 min keeps
    # today's effective ceiling for this slower tail (VIN index + VIN rollout cache are the two
    # genuinely multi-minute steps; crossProductCheck at 53 specs is the newest and least bounded).
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download invalidated specs list (if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: invalidated-specs
      - name: Rebuild VIN index (vin_index + vin_summary)
        id: vinindex
        continue-on-error: true
        run: |
          set -euo pipefail
          test -f scripts/buildVinIndex.js || { echo "::error::scripts/buildVinIndex.js not found in checkout"; exit 1; }
          node scripts/buildVinIndex.js
      - name: Refresh spec market cache (what each live spec sells for)
        id: specmarket
        continue-on-error: true
        run: node scripts/buildSpecMarketCache.js
      # Deferred, capped recompute of whatever ingest invalidated this run (Oct 2026 follow-up) -
      # ranked by real search volume, top RECOMPUTE_CAP (default 60) recomputed, the rest left for
      # the ordinary cold-read-on-next-visit path. Clean no-op when nothing was invalidated.
      - name: Recompute invalidated spec cache rows (capped, ranked by search volume)
        id: recomputespec
        continue-on-error: true
        run: node scripts/recomputeSpecCache.js --cap=60
      # Builds the Market Check landing example once a night
      - name: Build Market Check landing example (what the example car sold for)
        id: marketcheckexample
        continue-on-error: true
        run: node scripts/buildMarketCheckExample.js
      # Builds the Sell landing example once a night
      - name: Build Sell landing example (where the example car sells)
        id: sellexample
        continue-on-error: true
        run: node scripts/buildSellExample.js
      # Builds the Sam Desk (/business) worked example once a night
      - name: Build Sam Desk worked example (three Porsche 911 generations)
        id: deskexample
        continue-on-error: true
        run: node scripts/buildDeskExample.js
      - name: Build spec_pages (Porsche 911 spec/hub pages, serve-from-table)
        run: node scripts/buildSpecPagesCache.js
      - name: Precompute VIN rollout cache (sitemap-vins/motorcycles/other)
        id: vinrollout
        continue-on-error: true
        run: node scripts/buildVinRolloutCache.js
      - name: Search rules check (public pages)
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/searchCheck.js
        continue-on-error: true
      # Proves Buy, Sell, Market Check and Tasks read the same pool. Records the table nightly;
      # does not turn the job red yet.
      - name: Cross-product engine check (Buy/Sell/Market Check/Tasks agree)
        id: crossproductcheck
        continue-on-error: true
        run: node scripts/crossProductCheck.js
      - name: Fail the job if the VIN index step failed
        if: steps.vinindex.outcome == 'failure'
        run: |
          echo "::error::VIN index rebuild failed (see the Rebuild VIN index step above). Later steps still ran, but the job must end red."
          exit 1
      - name: Fail the job if the spec market cache step failed
        if: steps.specmarket.outcome == 'failure'
        run: |
          echo "::error::Spec market cache refresh failed (see the Refresh spec market cache step above). Later steps still ran, but the job must end red."
          exit 1
      - name: Fail the job if the recompute step failed
        if: steps.recomputespec.outcome == 'failure'
        run: |
          echo "::error::Deferred spec cache recompute failed (see the Recompute invalidated spec cache rows step above). Later steps still ran, but the job must end red. The ordinary cold-read-on-next-visit path still covers every affected spec meanwhile - this is a speed regression, not a correctness outage."
          exit 1
      - name: Fail the job if the Market Check example step failed
        if: steps.marketcheckexample.outcome == 'failure'
        run: |
          echo "::error::Market Check landing example build failed (see the Build Market Check landing example step above). Later steps still ran, but the job must end red. The landing still serves correctly off its own live fallback meanwhile. This is a cache freshness regression, not a correctness outage."
          exit 1
      - name: Fail the job if the Sell example step failed
        if: steps.sellexample.outcome == 'failure'
        run: |
          echo "::error::Sell landing example build failed (see the Build Sell landing example step above). Later steps still ran, but the job must end red. The landing still builds its example within its own wait meanwhile. This is a cache freshness regression, not a correctness outage."
          exit 1
      - name: Fail the job if the Sam Desk example step failed
        if: steps.deskexample.outcome == 'failure'
        run: |
          echo "::error::Sam Desk worked example build failed (see the Build Sam Desk worked example step above). Later steps still ran, but the job must end red. The /business page still serves correctly with its worked example section hidden meanwhile. This is a cache freshness regression, not a correctness outage."
          exit 1
      - name: Fail the job if the VIN rollout cache step failed
        if: steps.vinrollout.outcome == 'failure'
        run: |
          echo "::error::VIN rollout cache precompute failed (see the Precompute VIN rollout cache step above). Later steps still ran, but the job must end red. The sitemaps still serve correctly off the live budgeted fallback meanwhile - this is a speed/completeness regression, not a correctness outage."
          exit 1

  warm:
    runs-on: ubuntu-24.04
    needs: ingest
    timeout-minutes: 15
    # Only the nightly schedule warms; a manual backfill dispatch runs ingest only,
    # so a large historical pull never also spends warm budget. continue-on-error
    # keeps a best-effort warm blip from marking the whole run failed.
    # OCD_SKIP_WARM=1 (repo variable) cleanly SKIPS this job (shows skipped, not failed) to
    # conserve the OCD quota; unset/0 keeps warming.
    if: github.event_name == 'schedule' && vars.OCD_SKIP_WARM != '1'
    continue-on-error: true
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # warm:true is honoured only with our credential in a header (api/sellerDecision.js, Oct 2026).
      PROBE_KEY: ${{ secrets.PROBE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Rolling warm (~30 nameplates, budget-reserved so search outranks it)
        run: |
          set -euo pipefail
          test -f scripts/warm.js || { echo "::error::scripts/warm.js not found in checkout"; exit 1; }
          node scripts/warm.js --count=30

  attempts:
    runs-on: ubuntu-24.04
    needs: ingest
    timeout-minutes: 30
    # Nightly non-sold refresh (reserve-not-met + withdrawn) via the filtered status=unsold
    # pull. Runs AFTER the sold delta so canonical_sales is fresh for VIN linking. Schedule
    # only, so a manual sold-backfill dispatch of this workflow never also spends attempts
    # budget. --months=1 re-pulls the last ~30 days each night; the upsert on
    # (source_slug, source_record_id) makes the overlap idempotent. The heavy full-history
    # backfill stays on the on-demand nonsold.yml.
    # OCD_SKIP_ATTEMPTS=1 (repo variable) cleanly SKIPS this job (shows skipped, not failed) to
    # conserve the OCD quota; unset/0 keeps pulling.
    if: github.event_name == 'schedule' && vars.OCD_SKIP_ATTEMPTS != '1'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OLDCARSDATA_API_KEY: ${{ secrets.OLDCARSDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify required secrets are present
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY OLDCARSDATA_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Actions secret ${name} is EMPTY. Add it under Settings > Secrets and variables > Actions."
              missing=1
            else
              echo "${name}: present"
            fi
          done
          if [ "${missing}" -ne 0 ]; then echo "::error::Aborting: required secret(s) missing."; exit 1; fi
      - name: Nightly non-sold delta (last month, all 5 clean sources, filtered status=unsold)
        run: |
          set -euo pipefail
          test -f scripts/ingestAttempts.js || { echo "::error::scripts/ingestAttempts.js not found in checkout"; exit 1; }
          echo "Nightly attempts delta: --months=1 (all 5 clean sources)"
          node scripts/ingestAttempts.js --months=1

  premium:
    runs-on: ubuntu-24.04
    # Depends on INGEST only (archive freshness), NOT warm: warm is now conditionally skipped
    # (OCD_SKIP_WARM), and a skipped dependency would otherwise skip this archive-only job too.
    needs: ingest
    timeout-minutes: 15
    # Recompute + persist the data_verified premium for ALL FIVE partners AFTER the
    # archive is freshest (ingest + warm have already run), so the "recalculated as new
    # sales close" card line stays true without a manual trigger. Archive-only: ZERO OCD
    # spend. Own job (not a warm step) so a failure goes RED and notifies, rather than
    # being swallowed by warm's continue-on-error. Nightly schedule only.
    if: github.event_name == 'schedule'
    env:
      PROBE_KEY: ${{ secrets.PROBE_KEY }}
    steps:
      - name: Verify PROBE_KEY secret is present
        run: |
          set -euo pipefail
          if [ -z "${PROBE_KEY:-}" ]; then
            echo "::error::GitHub Actions secret PROBE_KEY is EMPTY. Add it under Settings > Secrets and variables > Actions (same value as the Vercel PROBE_KEY env var)."
            exit 1
          fi
          echo "PROBE_KEY: present"
      - name: Recompute and persist partner premiums (all five, archive-only)
        run: |
          set -euo pipefail
          echo "Recomputing partner premiums (archive-only, zero OCD)..."
          if ! body="$(curl -fsS --max-time 280 --get "https://goasksam.com/api/usageDashboard" \
              --data-urlencode "view=ops" --data-urlencode "task=premium" \
              --data-urlencode "persist=1" -H "x-ops-key: ${PROBE_KEY}")"; then
            echo "::error::Premium recompute request FAILED (network/HTTP/auth). Numbers may be stale until the next successful run."
            exit 1
          fi
          echo "$body" | jq -r '.report[]? | "  \(.partner): n=\(.n) premium=\(.premiumPct // "null")% gate=\(.gatePassed)"'
          if ! echo "$body" | jq -e '(.report|length>0) and (.persisted|length>0) and (all(.persisted[]; .wrote==true))' >/dev/null; then
            echo "::error::Premium recompute did not persist cleanly; a stale number may be sitting on a card."
            echo "$body" | jq -r '.persisted[]? | select(.wrote != true) | "  NOT WRITTEN: \(.partner) reason=\(.reason // "unknown")"' || true
            exit 1
          fi
          echo "Premium recompute OK: all partners persisted."

  cube:
    runs-on: ubuntu-24.04
    needs: ingest
    timeout-minutes: 20
    # Sam Desk aggregates cube (Stage C, spec s15). Runs AFTER the sold delta so the
    # archive is fresh, then: (1) tag any NEW rows' model_family (--only-null, cheap),
    # (2) rebuild desk_aggregates (Core + venue). Archive-only, ZERO OCD spend. Nightly
    # schedule only (a manual backfill dispatch runs ingest alone, never rebuilds the
    # cube on a partial pull). A failure goes RED and notifies; the Desk falls back to
    # the raw-scan path meanwhile, so a stale/failed cube is a slow answer, never a wrong one.
    if: github.event_name == 'schedule'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify required secrets are present
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Actions secret ${name} is EMPTY. Add it under Settings > Secrets and variables > Actions."
              missing=1
            else
              echo "${name}: present"
            fi
          done
          if [ "${missing}" -ne 0 ]; then echo "::error::Aborting: required secret(s) missing."; exit 1; fi
      - name: Tag new rows' model_family (only the null ones)
        run: |
          set -euo pipefail
          test -f scripts/backfillModelFamily.js || { echo "::error::scripts/backfillModelFamily.js not found in checkout"; exit 1; }
          node scripts/backfillModelFamily.js --only-null
      - name: Rebuild the Desk aggregates cube (Core + venue)
        run: |
          set -euo pipefail
          test -f scripts/deskCube.js || { echo "::error::scripts/deskCube.js not found in checkout"; exit 1; }
          node scripts/deskCube.js
