<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>About GoAskSam</title>
<meta name="description" content="GoAskSam is built by Sam Gold, also behind The Daily Vroom. It tells you where to sell your enthusiast car and why, using real sales data." />
<link rel="canonical" href="https://goasksam.com/about" />
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Geist';src:url('fonts/Geist-Variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap;}
:root{--ink:#16140F;--paper:#FFFFFF;--line:#E3E1DB;--slate:#6B6861;--accent:#8A7A55;--font:'Geist',-apple-system,system-ui,sans-serif;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;}
.wrap{max-width:720px;margin:0 auto;padding:32px 24px 80px;}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:26px;margin-bottom:34px;border-bottom:1px solid var(--line);}
.brand{font-weight:600;font-size:19px;letter-spacing:-.3px;color:var(--ink);text-decoration:none;}
.back{font-size:13.5px;color:var(--accent);text-decoration:none;white-space:nowrap;}
.back:hover{text-decoration:underline;}
h1{font-size:32px;line-height:1.2;font-weight:650;letter-spacing:-.5px;margin:0 0 18px;text-wrap:balance;}
p{margin:0 0 14px;}
a.inline{color:var(--accent);text-decoration:underline;}
footer.bottom{display:flex;gap:18px;align-items:center;margin-top:42px;padding-top:18px;border-top:1px solid var(--line);color:var(--slate);font-size:13.5px;}
footer.bottom a{color:var(--slate);text-decoration:none;}
footer.bottom a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">GoAskSam</a>
    <a class="back" href="/">&larr; Back to GoAskSam</a>
  </header>

  <h1>About GoAskSam</h1>
  <p>GoAskSam is built by Sam Gold, also behind <a class="inline" href="https://thedailyvroom.com" rel="noopener">The Daily Vroom</a>. GoAskSam tells you where to sell your enthusiast car and why, using real sales data. No estimates. No valuations.</p>

  <footer class="bottom">
    <span>&copy; GoAskSam, from The Daily Vroom</span>
    <a href="/">Home</a>
    <a href="/privacy">Privacy</a>
    <a href="mailto:feedback@goasksam.com">Contact</a>
  </footer>
</div>
</body>
</html>
