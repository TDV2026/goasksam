<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />

<!-- Internal review surface, DARK behind the crew/tester gate (the VIN-launch pattern):
     a device holding gas_tester=ok or gas_crew=ok is let in; anything else is sent home.
     Invite links: /onebox?tester=<code> / /onebox?crew=<code>. Launch = flip the gate to
     public (a later, separate T1.6 step); rollback = restore the gate. noindex at launch. -->
<script>
(function(){try{
  var c=document.cookie||"";
  // Crew/tester device: in immediately, no flag fetch.
  if(c.indexOf("gas_tester=ok")!==-1||c.indexOf("gas_crew=v1.")!==-1)return;
  // Invite code in the URL: exchange it (existing behavior), preserving query + hash.
  var m=/[?&](tester|crew)=([^&]*)/.exec(location.search||"");
  if(m){var q=m[1]==="tester"?"tcode":"code";location.replace("/api/crew?"+q+"="+encodeURIComponent(m[2])+"&to="+encodeURIComponent((location.pathname||"/onebox")+(location.search||"")+(location.hash||"")));return;}
  // Not crew: gate on the public-launch flag (app_config onebox_public via publicConfig).
  // Hide the page until the flag resolves so no content flashes. Public -> reveal; not
  // public -> home. Instant rollback: set onebox_public=0 and non-crew visitors bounce.
  document.documentElement.style.visibility="hidden";
  // Cache-bust so the gate ALWAYS reads the flag fresh (publicConfig is edge-cached ~2min
  // for the /sell auth path; the gate must not lag). This keeps both the flip and the
  // rollback instant: set onebox_public=0 and the very next non-crew load bounces.
  fetch("/api/publicConfig?ob="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
    if(d&&d.oneboxPublic){document.documentElement.style.visibility="";}
    else{location.replace("/");}
  }).catch(function(){location.replace("/");});
}catch(e){location.replace("/");}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" />
<style>
/* ============ One Box design of record (Oct 2026 mockup: Main / Phone / Vin / Thin / Question) ============
   Light only. Two faces: Newsreader (range, headings, prices, Sam's Take) and Instrument Sans (all else).
   No monospace anywhere. Body 15px+, secondary 14px+, only eyebrows and pills at 12-13px. */
:root{
  --page:#F6F3EC; --card:#FFFFFF; --border:#DCD8CC; --ink:#15201A; --green:#1E4D38; --green-dk:#15372A;
  --sec:#5E6B63; --div:#E2DED3; --take:#F1F5F1; --live:#2E8B57; --ph:#E6E2D8; --ph-ink:#4A564F;
  --soft:#3C4942; --chip:#C9D6CC; --tint:#EDF3EE; --tint-line:#D5E2D8;
  --vs-within:#2E7D4F; --vs-above:#D99A2B; --vs-below:#7A8794;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--green)}a:hover{color:var(--green-dk)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.linkbtn{background:none;border:0;padding:0;color:var(--green);font:600 15px/1.4 var(--sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.linkbtn:hover{color:var(--green-dk)}

/* ---- shell: left rail + main column (lib/appShell.js SHELL_CSS is spliced in server-side above;
   Market Check carries the same shared rail as every other page, Oct 2026 - a prior round hid it
   to match the approved mockup's full-bleed look; Sam reversed that decision, rail stays.
   .gas-submenu here is the "Your results" page-specific rail section's own dropdown) ---- */
.gas-submenu{display:none;flex-direction:column;margin:0 0 4px 14px;border-left:1px solid var(--rail-line,var(--div))}
.gas-submenu.open{display:flex}
.gas-submenu a{display:flex;align-items:center;min-height:40px;font:400 14px/1.3 var(--sans);color:var(--sec);text-decoration:none;padding:0 12px;cursor:pointer}
.gas-submenu a:hover{color:var(--ink)}
.ob-leadbar{margin:0;padding:6px 48px 0;font:400 13px/1.4 var(--sans);color:var(--sec);text-align:center}
.wrap{padding:10px 48px 56px;display:flex;justify-content:center}
/* Density (Job 7, result-page-polish round, desktop only - 390 keeps full width/normal padding,
   see the max-width:640px block below): Sam's own words were "main working area about 900 to 940
   pixels" as an ~8-10% reduction, but the width actually rendering on the result page measured
   860px before this round, already narrower than that range - 900 to 940 would have been an
   INCREASE. Read the instruction as the intent (make it read smaller) over the literal number:
   applied an actual ~9% reduction from the measured 860px to 780px, and scaled range type/card
   padding/section gaps by the same rough proportion below. Flagging the discrepancy plainly rather
   than silently reconciling it either way. */
#ob{width:100%;max-width:1040px;display:flex;flex-direction:column;gap:64px}

/* ---- empty state ---- */
.ob-home{min-height:calc(100dvh - 150px);display:flex;flex-direction:column;justify-content:center;gap:0;max-width:640px}
.ob-tag{margin:0;font:500 14px/1.4 var(--sans);color:var(--sec)}
.ob-head{font:600 46px/1.08 var(--serif);letter-spacing:-.02em;margin:14px 0 0;text-wrap:balance}
.ob-sub{margin:12px 0 24px;font:400 20px/1.45 var(--serif);color:var(--soft);max-width:32ch}
.ob-cue{margin:14px 2px 0;font:400 15px/1.4 var(--sans);color:var(--sec)}

/* ---- search box ---- */
.inbox{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px 8px 8px 20px}
.inbox input{flex:1;min-width:0;border:0;outline:0;font:400 19px/1.4 var(--sans);color:var(--ink);background:transparent}
.inbox input::placeholder{color:var(--sec)}
.inbox .go{width:48px;height:48px;flex:none;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:22px;cursor:pointer}
.inbox .go:hover{background:var(--green-dk)}
/* Sam's review round, Oct 2026: restored to the full-width box this page had before the mockup-
   match round's 30%-width experiment (.mc-bar carried max-width:30%/min-width:220px, which clipped
   a long car name at 390 wide and read too narrow on desktop against Sam's own call). The class
   stays on the markup (inboxHtml, js/onebox.js) only so New Sell's search bar - which never gets
   this class - is untouched; it carries no width rule of its own any more. */
.inbox-mag{width:18px;height:18px;flex:none;color:var(--sec)}

/* ---- resolved car line ---- */
.carline{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font:400 15px/1.4 var(--sans);color:var(--sec);margin:-4px 0 -8px}
.vinpill,.pill{display:inline-block;border-radius:999px;font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.vinpill{padding:6px 10px;background:var(--green);color:#fff}
/* "Change" (result-hero job, Oct 2026): desktop drops it - the search box sits directly above the
   result, already editable - and keeps it on mobile, where that box has scrolled out of view. */
.carline .ch{display:none}

/* ---- result hero zone (Oct 2026, result-hero job): the car as typed, then the scope line
   ("Matched to..."), both new - styled quietly, same family as the count line below them, so the
   car's own resolved name (.carline) still reads as the most prominent fact in this stack. ---- */
.typed-eyebrow{margin:0}
.rung-label{margin:0;font:500 15px/1.4 var(--sans);color:var(--soft)}

/* ================= HERO REBUILD (hero-rebuild round, Oct 2026) =================
   One glance: understand the answer, trust it, see a receipt you can click. Thin dividers, almost
   no shadows, no pills, serif headings, grey for everything that is not the answer - no card
   surface, no border, no box-shadow anywhere in this block or in .salesrow below it. Two columns
   at desktop (minmax so the receipt never gets crushed), one column stacked at 390 (media query at
   the bottom of this file, grouped with the rest of the phone rules). */
/* align-items default (stretch, not start): the right column (the chart) grows to match whichever
   column is taller instead of sizing to its own content alone and leaving empty space below it when
   the left column (mileage/identity lines) runs long - the chart itself still centers in that
   stretched space (.hero-chart below), so it never looks squeezed, only genuinely fills the row. */
.hero2col{display:grid;grid-template-columns:minmax(0,6fr) minmax(280px,6fr);gap:0 48px}
/* No chart (fewer than 3 qualifying quarters, item 1): hero-right is omitted entirely rather than
   rendered empty, so .hero-left is the grid's only child - span the full row instead of sitting in
   the first 6fr track, matching "the hero uses the full container width with the range left
   aligned." */
.hero2col > .hero-left:only-child{grid-column:1/-1}
.hero-left{display:flex;flex-direction:column;gap:10px;min-width:0;padding-right:36px;border-right:1px solid var(--div)}
.hero-right{min-width:0;display:flex;flex-direction:column}
.hero-label{margin:0}
/* Mockup match round: a clear gap (about one line height) before "WHERE THE MIDDLE HALF SOLD" -
   .hero-left's own flex gap (10px) is uniform for every child, so this one label gets extra
   top margin on top of it. */
.hero-label-range{margin-top:16px}
.hero-carname{margin:2px 0 0;font:600 28px/1.2 var(--serif);letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.hero-scope{margin:2px 0 0;font:400 17px/1.5 var(--sans);color:var(--sec)}
.hero-noband{margin:2px 0 0;font:400 17px/1.4 var(--serif);color:var(--ink)}
/* The info dot beside "WHERE THE MIDDLE HALF SOLD": a native title-attribute tooltip, no JS, no new
   popover component - see heroScopeText/infoDotHtml's own comment in js/onebox.js for why this is
   built fresh rather than reusing something that turned out not to exist yet. */
.infodot{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--sec);color:var(--sec);font:600 10px/1 var(--sans);margin-left:2px;vertical-align:middle;cursor:default}
.infodot::before{content:"i"}
.hero2col .range{margin-top:2px;font-size:44px;line-height:1.1;white-space:nowrap}
/* "to" matches the figures - same size, weight and green (Sam's explicit correction this round;
   the approved mockup itself shows it smaller and grey, overridden on purpose). */
.hero-divider{height:1px;background:var(--div);margin:10px 0 0}
.hero-idline{margin:2px 0 0;font:400 17px/1.6 var(--sans);color:var(--sec)}
.hero-idlink{font-size:17px}
/* Item 2 (Sam's review round): the chosen option in a persisted identity line reads as plain ink
   text, not a link - same weight/size as the .linkbtn options beside it, no underline, not
   clickable (it is a <span>, not a <button>). */
.hero-idlink-chosen{font:600 17px/1.4 var(--sans);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
/* Mileage line: an "Add mileage" field inline with its own sentence when nothing is applied yet, or
   "Range narrowed around N miles." plus a quiet Change link once one is - both one line, no card,
   no pill. The VIN/chassis reconfirm (restored, follow-up round) is the same one-line shape (field
   prefilled with the known mileage) plus a second, smaller grey sub-line underneath - still no card,
   no box. */
.hero-miles{margin:4px 0 0;font:400 17px/1.5 var(--sans);color:var(--sec);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hero-miles-sub{margin:2px 0 0;font:400 15px/1.4 var(--sans);color:var(--sec)}
.miles-inline{display:inline-flex;align-items:center;gap:8px}
.miles-inline input{width:160px;height:40px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font:500 15px var(--sans);color:var(--ink);background:var(--card);outline:none}
.miles-inline input:focus{border-color:var(--green)}
.miles-inline input::placeholder{color:var(--sec)}
.mi-unit{color:var(--sec)}
.mi-go{min-height:0;height:40px;padding:0 14px;border-radius:8px;background:var(--green);color:#fff;text-decoration:none}
.mi-go:hover{background:var(--green-dk);color:#fff}
.hero-dim{opacity:.4;pointer-events:none;transition:opacity .2s ease}
/* Right column, hero: "How this market has moved" - candles when the engine answer carries trend,
   else the strip (every sale as a dot on a lowest-to-highest line). No card surface, no photo. */
.hero-chart{flex:1;display:flex;flex-direction:column;gap:10px}
.hc-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.hero-chart h2{margin:0;font:600 20px/1.3 var(--serif);color:var(--ink)}
/* aspect-ratio (not a fixed px height): the SVG's own viewBox is cut to the SAME ratio (see
   candleChartHtml/stripChartHtml, js/onebox.js), so the chart always fills its box edge to edge at
   any column width - a fixed height paired with a mismatched viewBox ratio was leaving empty space
   below the content once preserveAspectRatio="meet" scaled to fit the narrower dimension. */
/* Ratio measured directly off the approved mockup's chart plot area (gridlines+bars+quarter
   labels, excluding the heading/legend) - about 11:7 (candleChartHtml's viewBox is 880x560, the
   same ratio), so the box is this shape at any container width, never stretched. */
.hc-svg{width:100%;aspect-ratio:11/7;display:block}
.hc-legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font:400 13px/1.3 var(--sans);color:var(--sec)}
.hc-legend-sw{display:inline-flex;align-items:center;gap:6px}
.hc-legend-box{width:12px;height:12px;border-radius:2px;background:var(--chip);display:inline-block}
.hc-legend-dot{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}
.hc-prioryear{margin:0;font:400 13px/1.4 var(--sans);color:var(--sec)}
.hc-bar{cursor:pointer}
.hc-bar:focus-visible{outline:2px solid var(--green);outline-offset:2px}
/* Tap tooltip (item 1/8): js/onebox.js's hcShowTip positions this near the tapped bar. */
.hc-tooltip{position:absolute;z-index:60;background:var(--ink);color:#fff;font:400 13px/1.4 var(--sans);padding:6px 10px;border-radius:6px;max-width:240px;pointer-events:none;box-shadow:0 4px 14px rgba(21,32,26,.22)}

/* ---- question screens (item 4, mockup match round, Oct 2026): VIN confirm, generation, model,
   body, typo-clarification, the identity takeover (gearbox/competition/documented-history) and the
   bare-make "Which BMW?" case all share this one full-width layout - no hero2col split (nothing
   ever filled the second column), the question at car-name size (.hero-carname, reused directly -
   same class, same size item 2 measured off the live Mustang page), options/actions in a real row
   below with generous spacing, no boxes/pills/chips. "Real sales only." is footHtml(), appended by
   renderQuestion() below every screen, not part of this block. */
.idq-question{margin-top:10px}
.idq-options-row{display:flex;flex-wrap:wrap;gap:14px 32px;margin-top:24px}
.idq-options-row .linkbtn{font-size:17px;min-height:44px}

/* ---- this car's own sales (Job 2, Sam's follow-up round): flat rows, no box/pill/badge - one
   line per real sale, a plain closing sentence placing the last one against the range. ---- */
.exactsales{display:flex;flex-direction:column;gap:2px;padding-top:14px;border-top:1px solid var(--border)}
.exactsales h2{margin:0 0 6px;font:600 22px/1.3 var(--serif)}
.exactsale-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding:10px 0;border-top:1px solid var(--div);font:400 16px/1.4 var(--sans);color:var(--ink)}
.exactsale-row:first-of-type{border-top:0}
.exactsale-price{font:600 17px/1.2 var(--serif)}
.exactsale-venue,.exactsale-miles{color:var(--sec)}
.exactsale-view{margin-left:auto}
.exactsale-note{margin:8px 0 0;font:400 16px/1.5 var(--sans);color:var(--soft)}

/* ---- sales row ("Sales behind this answer"): three borderless cards, no labels, no shadows,
   separated by thin vertical dividers, never boxed like the comparable-sales grid below it. ---- */
.salesrow{display:flex;flex-direction:column;gap:14px;padding-top:14px;border-top:1px solid var(--border)}
.salesrow h2{margin:0;font:600 22px/1.3 var(--serif)}
.salesrow-sub{margin:0;font:400 17px/1.5 var(--sans);color:var(--sec)}
/* gap:40px (not padding on each card): every card gets the SAME width, so the three fixed-aspect
   photos render at the SAME height - a per-card padding that drops on the first/last child (the
   earlier approach) made the outer two wider than the middle one, a real inequality the proof
   round's own measured report caught. The divider sits at the midpoint of that gap. */
.salescards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 40px}
.salescard{display:flex;flex-direction:column;position:relative;text-decoration:none;color:inherit;min-width:0}
.salescard+.salescard::before{content:"";position:absolute;left:-20px;top:0;bottom:0;width:1px;background:var(--div)}
.salescard .ph{border-radius:2px;aspect-ratio:3/2}
.salescard-body{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.salescard-price{margin:0;font:600 20px/1.2 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.salescard-title{margin:0;font:500 16px/1.35 var(--sans);color:var(--ink)}
.salescard-meta{margin:0;font:400 15px/1.4 var(--sans);color:var(--sec)}
a.salescard:hover .salescard-title{text-decoration:underline;text-underline-offset:3px}
.salesrow-foot{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:2px}

/* ---- answer card ---- */
/* Simple block now (result-page-polish round, Job 2d): Sam's Take used to be a separate grid
   column beside ans-main (a 10-column grid, ans-main spanning 7, take spanning 3). Every caller of
   .anscard already carried the "solo" full-width override, so that split was already dead for both
   of this file's two callers before this round touched it - removed the grid entirely rather than
   leave an unused column system for a future reader to puzzle over. Take now lives INSIDE ans-main's
   own HTML (one more child in its flex column), directly under the range/no-band line. */
.anscard{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.ans-main{padding:23px 25px 21px;display:flex;flex-direction:column;gap:9px}
.eyebrow{font:600 12px/1.4 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--sec)}
.colhead{font:600 12px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--sec)}
.range{margin:0;font:600 36px/1.1 var(--serif);color:var(--green);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.range .to{font-weight:400;font-size:24px;color:var(--sec)}
/* Thin tier and the identity-question takeover both use this same heading size, but never green -
   only a real cluster (the "Where the middle half sold" band) ever gets the green number. */
.range.ink{color:var(--ink)}
.landed{margin:0;font:400 18px/1.4 var(--serif);color:var(--ink)}
/* ---- range bar: full spread, typical band highlighted, labelled ends - now only inside the
   collapsed "sales sat outside" note (Job 2c, result-page-polish round; was also always-visible
   under the range, removed from there - a second spread next to the headline range read as a
   second, competing number). ---- */
.rangebar{margin-top:2px}
.rb-row{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"lo track hi";align-items:center;gap:10px}
.rb-end{font:400 13px/1 var(--sans);color:var(--sec);font-variant-numeric:tabular-nums;white-space:nowrap}
.rb-lo{grid-area:lo}
.rb-hi{grid-area:hi;text-align:right}
.rb-track{grid-area:track;position:relative;height:4px;background:var(--border);border-radius:2px}
.rb-band{position:absolute;top:0;height:4px;background:var(--green);border-radius:2px}
.fresh{display:flex;gap:10px;align-items:center;font:400 14px/1.4 var(--sans);color:var(--sec);margin-top:4px}
.fresh .dot{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none}
.ans-line{margin:0;font:400 15px/1.5 var(--sans);color:var(--soft)}
.roundel{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--green);color:var(--green);font:600 10px/1 var(--sans);letter-spacing:.08em;display:flex;align-items:center;justify-content:center}
.roundel.lg{width:40px;height:40px;font-size:11px}

/* ---- evidence block: the range card's sub-sections - the collapsed outside-range line and "How
   Sam decided" - as direct children of the SAME .anscard, so the whole thing reads as one card with
   no border between parts (CLAUDE.md: a screenshot of the first screen alone must still show the
   range and the real sales it came from). ---- */
.otherhalf,.offwindow{margin-top:2px;font:400 12.5px/1.3 var(--sans);color:var(--sec)}
.ev-why-note,.ev-aside-note{padding:14px 0 0}
.ev-why-note[hidden],.ev-aside-note[hidden]{display:none}
.ev-why-note p{margin:0;font:400 17px/1.5 var(--sans);color:var(--sec);max-width:68ch}
.ev-aside-note .rangebar{margin:4px 0 16px}
.ev-aside-note .sep-note{margin-bottom:14px}
/* ---- notes under the answer (engine-gated secondary lines; today only the VIN-no-sale note) ---- */
.notes{display:flex;flex-direction:column;gap:8px;margin-top:-8px}
.notes p{margin:0;font:400 17px/1.5 var(--serif);color:var(--soft)}
.notes .num{font-weight:600;color:var(--ink)}

.chev{width:12px;height:12px;flex:none}
.chev path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.linkbtn .chev{display:inline-block;margin-left:2px;vertical-align:middle}

/* ---- section head ---- */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:14px;border-top:1px solid var(--border)}
.sec-head h2{margin:0;font:600 22px/1.3 var(--serif)}
.sec-head .scope{display:block;font:400 17px/1.45 var(--sans);color:var(--sec);margin-top:2px}
.sec-head .linkbtn{white-space:nowrap}
.sep-note{margin:0;font:400 17px/1.5 var(--sans);color:var(--sec);max-width:68ch}
/* ---- long-list cap (Oct 2026): extra cards server-render, just hidden until "Show 10 more" ---- */
.cap-extra[hidden]{display:none}
.cap-extra:not([hidden]){display:contents}
.capshow{margin-top:14px}

/* ---- cards ---- */
.cards5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;align-items:start}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.card.clickable{cursor:pointer}
.card:hover{border-color:var(--green)}
/* Second addendum item 1 (result-page-polish round two): price, title and the miles/venue/month
   meta line are plain text, no underline ever - the title's own <a> stretches over the whole card
   (::after, inset:0) so the card is clickable everywhere without looking like a pile of links. Same
   technique api/buy.js's CARD_RULES_CSS already uses for Buy's own cards, under this file's own
   .card/.ctitle names. Real actions (View sale, a sold-before/full-history line) sit above the
   stretch at z-index 2 and keep their own underline - those are deliberate text actions, not the
   card's own repeated link. */
.ctitle{margin:0;font:500 17px/1.35 var(--sans);color:var(--ink)}
.ctitle a{color:inherit;text-decoration:none}
.ctitle a::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit}
.ctitle a:focus-visible{outline:none}
.card:has(.ctitle a:focus-visible){outline:2px solid var(--green);outline-offset:2px}
.viewsale{position:relative;z-index:2;display:inline-flex;align-items:center;gap:4px;margin-top:2px;font:600 13.5px/1.3 var(--sans);color:var(--sec);text-decoration:none}
.viewsale:hover{color:var(--green)}
.card.hero{grid-column:span 3}
.cards5.single .card.hero{grid-column:1 / -1}
.card.this{border:1.5px solid var(--green)}
/* Fixed aspect ratio, not a per-context pixel height: the box reserves its own space the instant
   the card renders, before a lazy-loaded image arrives or fails, so a missing/broken photo
   (.noimg, onerror removes the <img>) never changes the card's height and never breaks row
   alignment in a grid - the placeholder fills exactly the same box a real photo would have. */
.ph{position:relative;background:var(--ph);flex:none;aspect-ratio:4/3;height:auto}
/* position:absolute (not a normal-flow width:100%/height:100%): a percentage height on a normal-
   flow child does not resolve against a parent whose own height is "auto" (even when aspect-ratio
   gives that parent a definite computed height) - found live on the sales-row cards, where a card
   WITH a real photo rendered its .ph box at the photo's own intrinsic ratio (240px, 4:3) instead of
   the card shape's 3:2 (213px), while the two "no photo" placeholder siblings (already absolutely
   positioned) were unaffected. Absolute positioning against the already-relative .ph sizes the img
   from the parent's actual layout box, matching .ph .none's existing (unaffected) pattern. */
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ph-ink)}
.ph img+.none{display:none}
.ph.noimg .none{display:flex}
.hero .ph{aspect-ratio:16/9}
.pill{position:absolute;top:14px;left:14px;padding:6px 12px;background:var(--green);color:#fff}
/* Job 8 (result-page-polish round, colour discipline): never green or red for a range position -
   the "neutral" class the JS already adds to an Above/Below range pill (photoHtml) had no matching
   rule here, so those pills were silently rendering in the same green fill as every other pill
   (Closest match, This car...). Plain ink on the card surface. The live panel's own VS. RANGE column
   (.lp-vsrange) is plain text too, never a pill - see that class below. */
.pill.neutral{position:absolute;top:14px;left:14px;background:var(--card);color:var(--sec);border:1px solid var(--border)}
.cbody{padding:16px 20px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.price-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.cprice{font:600 29px/1 var(--serif);font-variant-numeric:tabular-nums}
.cvenue{font:400 14px/1.4 var(--sans);color:var(--sec)}
.ctitle{font:500 17px/1.35 var(--sans);color:var(--ink)}
.cmeta{font:400 14px/1.45 var(--sans);color:var(--sec)}
.callin{font:400 14px/1.4 var(--sans);color:var(--sec)}
.cwhy{margin:4px 0 0;font:italic 400 16px/1.45 var(--serif);color:var(--soft)}
.histlink{position:relative;z-index:2;margin-top:4px;font:600 15px/1.4 var(--sans);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center;align-self:flex-start}
.sb-line{position:relative;z-index:2;margin-top:2px;font:400 14px/1.4 var(--sans);color:var(--sec);text-decoration:underline;text-underline-offset:3px}
a.sb-line:hover{color:var(--green)}
.mk{display:inline-block;font:600 12px/1 var(--sans);letter-spacing:.04em;color:var(--green);background:var(--tint);border:1px solid var(--tint-line);border-radius:999px;padding:5px 9px;margin:4px 6px 0 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid2 .ph{height:200px}
.grid2 .cprice{font-size:26px}
.grid2 .ctitle{font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid3 .cprice{font-size:22px}
.grid3 .cbody{padding:12px 16px 14px;gap:4px}
.grid3 .ctitle{font-size:15px}

/* ---- flat rows (follow-up round, Oct 2026): the thin tier's own receipts grid, the collapsed
   outside-range cards and the market-read quarter panel all render here instead of grid2/grid3 -
   one column, thin row dividers, no card surface. saleCardHtml's o.flat (see that function) strips
   the box/pill from each card; this is the one-column list wrapper they sit in instead of a grid. */
.flatlist{display:flex;flex-direction:column}
.card.flat{background:transparent;border:0;border-radius:0;overflow:visible;flex-direction:row;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--div)}
.flatlist .card.flat:first-child{border-top:0}
.card.flat:hover{border-color:var(--div)}
.card.flat .ph{width:64px;height:48px;flex:none;border-radius:2px;aspect-ratio:auto}
.card.flat .cbody{padding:0;gap:1px;flex:1;min-width:0}
.card.flat .ctitle{font-size:14px}
.card.flat .cprice{font-size:16px}
.card.flat .cmeta{font-size:13px}
.card.flat .callin{font-size:12px}
.card.flat .viewsale{margin-top:4px}
.card.flat .sb-line,.card.flat .histlink{margin-top:4px}
/* markers (.mk): a tinted pill elsewhere on the page, plain inline grey text here - "no pills". */
.card.flat .mk{display:inline;background:none;border:0;border-radius:0;padding:0;margin:0 10px 0 0;color:var(--sec);font-weight:600;letter-spacing:0;text-transform:none}
/* the pill (tagLabel / "This car") becomes small-caps grey text above the price - no pills. */
.flat-tag{margin:0 0 2px;font:600 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--sec)}
@media (max-width:640px){
  .card.flat{gap:12px}
  .card.flat .ph{width:52px;height:40px}
}

/* ---- question card (inside a result) + question screen ---- */
.qchip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--chip);background:var(--card);color:var(--ink);font:500 15px var(--sans);cursor:pointer}
.qchip:hover,.qchip.sel{border-color:var(--green);color:var(--green)}
.qchip.typeit{border-style:dashed;color:var(--sec)}
.qchip:disabled{opacity:.5;cursor:default;color:var(--sec)}
.qchip:disabled:hover{border-color:var(--chip);color:var(--sec)}
.typemiles{display:inline-flex;gap:8px;align-items:center}
.typemiles input{width:120px;min-height:44px;border:1px solid var(--chip);border-radius:999px;padding:0 16px;font:500 15px var(--sans);color:var(--ink);background:var(--card);outline:none}
.typemiles input:focus{border-color:var(--green)}
.qscreen{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px 28px 28px;display:flex;gap:18px}
.qscreen .qbody{display:flex;flex-direction:column;gap:16px;min-width:0}
.qscreen .qtop{display:flex;flex-direction:column;gap:6px}
.qscreen .eyebrow{color:var(--green)}
.qtext{margin:0;font:400 28px/1.3 var(--serif);text-wrap:pretty}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{min-height:48px;padding:0 24px;border-radius:999px;border:1.5px solid var(--green);background:var(--card);color:var(--green);font:600 17px var(--sans);cursor:pointer}
.chip:hover{background:var(--green);color:#fff}
.chip.ghost{border-style:dashed;border-color:var(--chip);color:var(--sec);font-weight:500}
.chip.ghost:hover{background:var(--card);border-color:var(--green);color:var(--green)}
.qsub{font:400 15px/1.4 var(--sans);color:var(--sec)}
.trustline{display:flex;gap:10px;align-items:center;font:400 15px/1.4 var(--sans);color:var(--sec);padding-top:14px;border-top:1px solid var(--div)}
.trustline .dot{width:9px;height:9px;border-radius:50%;background:var(--live);flex:none}

/* ---- Sam message (errors, VIN confirm, refusal reasons): a card with the roundel, never a Take panel ---- */
.sam{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 24px;display:flex;gap:16px;align-items:flex-start}
.sam .body{display:flex;flex-direction:column;gap:10px;min-width:0}
.sam .tag{font:600 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.sam p{margin:0;font:400 19px/1.45 var(--serif);color:var(--ink)}
.sam.big p{font-size:24px;line-height:1.35}
.refusal{display:flex;flex-direction:column;gap:20px}
.refusal .ans{margin:0;font:400 30px/1.3 var(--serif);max-width:26ch;text-wrap:balance}
.wayfwd{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---- live panel (cars in this family live right now): a plain table - CAR / VENUE / LAST BID WE
   SAW / VS. RANGE, small-caps column heads, one pixel row dividers, no pills, no coloured dots. ---- */
.livepanel{display:flex;flex-direction:column;gap:4px}
.lp-summary{margin:0;font:400 17px/1.5 var(--sans);color:var(--sec)}
.lptable{width:100%;border-collapse:collapse;margin-top:8px}
.lptable th{text-align:left;padding:0 12px 8px 0;border-bottom:1px solid var(--border)}
.lptable td{padding:12px 12px 12px 0;border-top:1px solid var(--div);vertical-align:top}
.lptable tr:first-child td{border-top:0}
.lp-car{display:flex;align-items:center;gap:12px;min-width:0}
.lp-ph{position:relative;width:64px;height:43px;flex:none;background:var(--ph);overflow:hidden}
.lp-ph img{width:100%;height:100%;object-fit:cover;display:block}
.lp-ph .none{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:600 8px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ph-ink);text-align:center}
.lp-ph.noimg .none{display:flex}
.lp-cbody{min-width:0;display:flex;flex-direction:column;gap:2px}
.lp-title{font:500 16px/1.3 var(--sans);color:var(--ink);text-decoration:none}
.lp-title:hover{text-decoration:underline;text-underline-offset:3px}
.lp-miles{display:block;font:400 14px/1.3 var(--sans);color:var(--sec)}
.lp-venue{display:block;font:400 16px/1.3 var(--sans);color:var(--ink)}
.lp-ends{display:block;font:400 15px/1.3 var(--sans);color:var(--sec)}
.lp-bid b{font:600 20px/1.2 var(--serif);color:var(--ink);font-weight:600;white-space:nowrap}
.lp-bidtime{display:block;font:400 15px/1.3 var(--sans);color:var(--sec)}
.lp-vsrange{font:400 16px/1.3 var(--sans);color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.lp-dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.lp-dot-within{background:var(--vs-within)}
.lp-dot-above{background:var(--vs-above)}
.lp-dot-below{background:var(--vs-below)}
@media (max-width:640px){
  .lptable,.lptable thead{display:block}
  .lptable thead{display:none}
  .lptable tbody,.lptable tr{display:block}
  .lptable tr{padding:12px 0;border-top:1px solid var(--div)}
  .lptable tr:first-child{border-top:0}
  .lptable td{display:block;padding:2px 0;border-top:0}
  .lp-ph{width:52px;height:36px}
}

/* ---- the full list ("All N comparable sales"): a plain table - DATE / CAR / MILES / VENUE / PRICE,
   price right aligned serif. First ten rows render; the rest sit hidden until "Show more sales". ---- */
.allsales-table{width:100%;border-collapse:collapse;margin-top:8px}
.allsales-table th{text-align:left;padding:0 12px 8px 0;border-bottom:1px solid var(--border)}
.allsales-table th.astc-price{text-align:right;padding-right:0}

.allsales-table a{color:inherit;text-decoration:none}

@media (max-width:640px){

  .allsales-table tbody[hidden]{display:none}
  .allsales-table tr{padding:12px 0;border-top:1px solid var(--div)}
  .allsales-table tr:first-child{border-top:0}
  .allsales-table td{padding:1px 0;border-top:0}
  .allsales-table td.astc-price{text-align:left}
}

/* ---- how this market is distributed: price-band rows, pale green bar proportional to count, the
   bar holding the typical sale in deep green. Clicking a row expands its receipts, one at a time. ---- */
.distrows{display:flex;flex-direction:column;margin-top:8px}
.distrow{display:flex;flex-direction:column}
.distrowbtn{display:grid;grid-template-columns:160px 1fr auto;align-items:center;gap:16px;width:100%;padding:10px 0;border:0;border-top:1px solid var(--div);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:44px}
.distrows .distrow:first-child .distrowbtn{border-top:0}
.distrowbtn:hover{background:var(--tint)}
.dist-label{font:400 15px/1.3 var(--sans);color:var(--sec);white-space:nowrap}
.dist-track{position:relative;height:16px;background:#EFEDE6}
.dist-bar{position:absolute;top:0;left:0;height:16px;background:var(--chip)}
.dist-bar.typical{background:var(--green)}
.dist-count{font:400 15px/1.3 var(--sans);color:var(--sec);text-align:right;white-space:nowrap}
.dist-panel{padding:4px 0 10px}
.dist-panel[hidden]{display:none}
@media (max-width:640px){
  .distrowbtn{grid-template-columns:1fr auto;grid-template-areas:"label count" "track track";row-gap:6px}
  .dist-label{grid-area:label}
  .dist-count{grid-area:count}
  .dist-track{grid-area:track}
}

/* ---- ready to sell ---- */
/* Job 5 / addendum item 7 (result-page-polish round two): height and visual weight reduced roughly a
   fifth - a quiet next step on a research page, not an advert interrupting it. Same green, same button,
   same copy; only padding/type scale down (20->16px, 22px->22px top padding->18px, h3 22->18px).
   Flattened (follow-up round, Oct 2026): a full-width flat band, not a rounded floating card - the
   one green element left below the hero, per the brief's "one green action only". */
.sellbox{background:var(--green);color:#fff;border-top:1px solid var(--border);padding:24px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sellbox .st{display:flex;flex-direction:column;gap:4px}
.sellbox h3{margin:0;font:600 28px/1.2 var(--serif)}
.sellbox p{margin:0;font:400 16px/1.4 var(--sans);color:#D5E2D8}
.sellbox a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:2px;background:#fff;color:var(--green);font:600 15px var(--sans);text-decoration:none}
.sellbox a:hover{background:var(--tint);color:var(--green-dk)}

/* ---- put Sam on it (item 9, Oct 2026): plain text, no box - follow-up round, Oct 2026 ---- */
.samonit{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border)}
.samonit-main{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
.samonit p{margin:0;font:400 17px/1.4 var(--sans);color:var(--soft)}
.samonit-msg{margin:0;font:400 15px/1.4 var(--sans);color:var(--sec)}
.samonit-msg[hidden]{display:none}
.samonit-on{color:var(--green)!important;font-weight:600}
.samonit-free{margin:0;font:400 15px/1.4 var(--sans);color:var(--sec)}
.samonit-main .linkbtn{font-size:17px}

/* ---- loader ---- */
.loader{display:flex;align-items:baseline;gap:4px;font:500 15px/1.5 var(--sans);color:var(--sec)}
.loader .ldots{display:inline-flex;gap:3px;margin-left:2px}
.loader .ldots i{width:4px;height:4px;border-radius:50%;background:var(--green);display:inline-block;animation:obdot 1.1s ease-in-out infinite}
.loader .ldots i:nth-child(2){animation-delay:.18s}
.loader .ldots i:nth-child(3){animation-delay:.36s}
@keyframes obdot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.loader .ldots i{animation:none;opacity:.6}}

/* ---- streaming stages ---- */
[data-stage]{opacity:1;transform:none;transition:opacity .28s ease,transform .28s ease}
[data-stage].stage-pending{opacity:0;transform:translateY(6px)}
@media (prefers-reduced-motion:reduce){[data-stage]{transition:none}[data-stage].stage-pending{opacity:1;transform:none}}

  /* ---- hero, phone stacking: label, car name, scope line, mileage line+field, range/headline,

  .salescard-title{font-size:15px}

  /* Live right now / All N comparable sales (item 8): real <table> markup stays - headers hidden,
     every row becomes a stacked block with a hairline between rows, cell groups keep their own
