name: Nightly ingest and warm

# 7D/7E: the version-controlled nightly mechanism (there are no Vercel crons in
# vercel.json). GitHub Actions runs the delta ingest and the rolling warm.
on:
  schedule:
    - cron: "30 8 * * *"   # 08:30 UTC nightly
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Optional backfill start (YYYY-MM-DD)"
        required: false
      backfill_to:
        description: "Optional backfill end (YYYY-MM-DD)"
        required: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delta ingest (or backfill range if provided)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLDCARSDATA_API_KEY: ${{ secrets.OLDCARSDATA_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.backfill_from }}" ]; then
            node scripts/ingest.js --from=${{ github.event.inputs.backfill_from }} --to=${{ github.event.inputs.backfill_to }}
          else
            node scripts/ingest.js --delta
          fi

  warm:
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rolling warm (~30 nameplates, budget-reserved so search outranks it)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/warm.js --count=30
